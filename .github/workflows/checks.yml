name: Application checks
on:
  push:
    branches: [main, feat/operacao-online-obra30]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RENDER_DEPLOY_DIARIO_OBRAS_20260630-132656
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: itauba_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-disposable-password@127.0.0.1:5432/itauba_test_ci
      TEST_DATABASE_SSL: 'false'
      TEST_DATABASE_IS_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: RENDER_DEPLOY_DIARIO_OBRAS_20260630-132656/package-lock.json
      - run: npm ci --include=dev
        env:
          NODE_ENV: production
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:db
      - run: node tests/acceptance/concurrent.mjs
